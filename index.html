<style>
  :root {
    --bg: #0f0e0c; --surface: #1a1916; --surface2: #242220; --border: #2e2c28;
    --accent: #e8c547; --accent2: #d4a843; --text: #f0ebe0; --text-dim: #8a8070;
    --red: #e05a4e; --green: #5ec47a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: 'Noto Serif KR', serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  .topnav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; padding-top: max(14px, env(safe-area-inset-top)); }
  .topnav h1 { font-size: 16px; font-weight: 700; color: var(--accent); }
  .topnav span { font-size: 10px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }
  .bottom-tabs { background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tab-btn { flex: 1; padding: 12px 8px; background: none; border: none; color: var(--text-dim); font-family: 'Noto Serif KR', serif; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: color 0.15s; }
  .tab-btn .icon { font-size: 20px; }
  .tab-btn.active { color: var(--accent); }
  .tab-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin-top: 2px; display: none; }
  .tab-btn.active .tab-dot { display: block; }
  .pages { flex: 1; overflow: hidden; position: relative; }
  .page { position: absolute; inset: 0; overflow-y: auto; display: none; padding: 16px; }
  .page.active { display: block; }
  .section-label { font-size: 10px; font-family: 'IBM Plex Mono', monospace; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; margin-top: 20px; }
  .section-label:first-child { margin-top: 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  .form-group { margin-bottom: 10px; }
  .form-group label { font-size: 11px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; display: block; margin-bottom: 4px; }
  .form-group input, .form-group select { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; appearance: none; -webkit-appearance: none; }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); }
  .form-group input::placeholder { color: var(--text-dim); }
  .btn { padding: 12px 20px; border-radius: 8px; border: none; font-family: 'IBM Plex Mono', monospace; font-size: 13px; cursor: pointer; font-weight: 500; transition: all 0.15s; width: 100%; margin-top: 4px; }
  .btn-primary { background: var(--accent); color: #0f0e0c; }
  .btn-primary:active { background: var(--accent2); transform: scale(0.98); }
  .btn-outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .btn-danger-sm { background: transparent; color: var(--red); border: 1px solid var(--red); padding: 6px 10px; border-radius: 6px; font-family: 'IBM Plex Mono',monospace; font-size: 11px; cursor: pointer; }
  .ing-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; } }
  .ing-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .ing-meta { font-size: 11px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }
  .ing-unit-price { font-size: 12px; color: var(--accent); font-family: 'IBM Plex Mono', monospace; margin-bottom: 6px; text-align: right; }
  .recipe-ing-row { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; display: grid; grid-template-columns: 1fr 90px 28px; gap: 8px; align-items: center; animation: fadeIn 0.2s ease; }
  .recipe-ing-row select, .recipe-ing-row input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 7px 8px; border-radius: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; width: 100%; appearance: none; -webkit-appearance: none; }
  .recipe-ing-row select:focus, .recipe-ing-row input:focus { outline: none; border-color: var(--accent); }
  .row-cost { font-size: 11px; color: var(--accent); font-family: 'IBM Plex Mono', monospace; text-align: right; grid-column: 1/-1; }
  .remove-btn { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; line-height: 1; padding: 0 2px; }
  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .result-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; text-align: center; }
  .result-box.accent-box { border-color: var(--accent); background: rgba(232,197,71,0.05); }
  .r-label { font-size: 10px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; letter-spacing: 1px; margin-bottom: 6px; }
  .r-value { font-size: 18px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; }
  .clr-accent { color: var(--accent); } .clr-green { color: var(--green); } .clr-red { color: var(--red); }
  .empty { text-align: center; padding: 40px 20px; color: var(--text-dim); }
  .empty .e-icon { font-size: 36px; margin-bottom: 10px; opacity: 0.4; }
  .empty p { font-size: 13px; }
  .form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .install-banner { background: linear-gradient(135deg, #1a1916, #242220); border: 1px solid var(--accent); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  .install-banner h3 { font-size: 15px; color: var(--accent); margin-bottom: 6px; }
  .install-banner p { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; line-height: 1.6; }
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--accent); color: #0f0e0c; padding: 10px 20px; border-radius: 20px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap; z-index: 999; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="topnav">
  <h1>🍽 식재료 원가계산기</h1>
  <span id="ing-count">재료 0개</span>
</div>
<div class="pages">
  <!-- PAGE 1: 재료 관리 -->
  <div class="page active" id="page-ingredients">
    <div id="install-banner-wrap"></div>
    <div class="section-label">재료 등록</div>
    <div class="card">
      <div class="form-group"><label>재료명</label><input type="text" id="ing-name" placeholder="예: 닭가슴살"></div>
      <div class="form-2col">
        <div class="form-group"><label>단위</label>
          <select id="ing-unit"><option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="L">L</option><option value="개">개</option><option value="봉">봉</option><option value="팩">팩</option></select>
        </div>
        <div class="form-group"><label>구입량</label><input type="number" id="ing-qty" placeholder="1000" inputmode="decimal"></div>
      </div>
      <div class="form-group"><label>구입 금액 (원)</label><input type="number" id="ing-price" placeholder="5000" inputmode="decimal"></div>
      <button class="btn btn-primary" onclick="addIngredient()">+ 재료 추가</button>
    </div>
    <div class="section-label">등록된 재료</div>
    <div id="ingredient-list"><div class="empty"><div class="e-icon">🧅</div><p>재료를 추가해주세요</p></div></div>
  </div>
  <!-- PAGE 2: 레시피 -->
  <div class="page" id="page-recipe">
    <div class="section-label">레시피 정보</div>
    <div class="card">
      <div class="form-group"><label>레시피명</label><input type="text" id="recipe-name" placeholder="예: 닭갈비"></div>
      <div class="form-2col">
        <div class="form-group"><label>인분수</label><input type="number" id="recipe-servings" value="1" min="1" inputmode="numeric" oninput="recalculate()"></div>
        <div class="form-group"><label>판매가 (원)</label><input type="number" id="selling-price" placeholder="12000" inputmode="decimal" oninput="recalculate()"></div>
      </div>
    </div>
    <div class="section-label">사용 재료</div>
    <div id="recipe-rows"><div class="empty"><div class="e-icon">🍳</div><p>아래 버튼으로 재료를 추가해요</p></div></div>
    <button class="btn btn-outline" style="margin-top:8px;" onclick="addRecipeRow()">+ 재료 추가</button>
  </div>
  <!-- PAGE 3: 결과 -->
  <div class="page" id="page-result">
    <div class="section-label">원가 분석</div>
    <div class="result-grid">
      <div class="result-box accent-box"><div class="r-label">총 원가</div><div class="r-value clr-accent" id="res-total">₩0</div></div>
      <div class="result-box accent-box"><div class="r-label">1인분 원가</div><div class="r-value clr-accent" id="res-per">₩0</div></div>
      <div class="result-box"><div class="r-label">원가율</div><div class="r-value" id="res-ratio">-</div></div>
      <div class="result-box"><div class="r-label">1인분 마진</div><div class="r-value" id="res-margin">-</div></div>
    </div>
    <div class="section-label">목표 마진 역산</div>
    <div class="card">
      <div class="form-group"><label>목표 원가율 (%)</label><input type="number" id="target-ratio" placeholder="예: 30" inputmode="decimal" oninput="calcTarget()"></div>
      <div class="result-box accent-box" style="margin-top:4px;"><div class="r-label">권장 판매가 (1인분)</div><div class="r-value clr-accent" id="target-price">-</div></div>
    </div>
    <div class="section-label">재료별 원가 비중</div>
    <div id="breakdown-list"><div class="empty"><div class="e-icon">📊</div><p>레시피를 구성하면 비중이 표시됩니다</p></div></div>
  </div>
</div>
<div class="bottom-tabs">
  <button class="tab-btn active" onclick="switchTab(0,this)"><span class="icon">🧅</span>재료관리<span class="tab-dot"></span></button>
  <button class="tab-btn" onclick="switchTab(1,this)"><span class="icon">🍳</span>레시피<span class="tab-dot"></span></button>
  <button class="tab-btn" onclick="switchTab(2,this)"><span class="icon">📊</span>결과분석<span class="tab-dot"></span></button>
</div>
<div class="toast" id="toast"></div>
<script>
let ingredients = JSON.parse(localStorage.getItem('fcc-v2') || '[]');
let recipeRows = [];
let deferredPrompt = null;
const pages = ['page-ingredients','page-recipe','page-result'];

// PWA Install
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  showInstallBanner('android');
});
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
if (!isStandalone) {
  if (isIOS) showInstallBanner('ios');
  else setTimeout(() => { if (!deferredPrompt) showInstallBanner('guide'); }, 2000);
}
window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner-wrap').innerHTML = '';
  showToast('✅ 앱이 설치되었습니다!');
});

function showInstallBanner(type) {
  let content = '';
  if (type === 'android') {
    content = `<div class="install-banner"><h3>📲 홈화면에 설치하기</h3><p>앱으로 설치하면 오프라인에서도 사용할 수 있어요!</p><button class="btn btn-outline" onclick="installPWA()">홈화면에 추가</button></div>`;
  } else if (type === 'ios') {
    content = `<div class="install-banner"><h3>📲 홈화면에 설치하기 (아이폰)</h3><p>① 하단 공유버튼(□↑) 누르기<br>② "홈 화면에 추가" 선택<br>③ 오른쪽 상단 "추가" 누르기</p></div>`;
  } else {
    content = `<div class="install-banner"><h3>📲 홈화면에 설치하기</h3><p>브라우저 메뉴 → "홈 화면에 추가" 또는 "앱 설치"를 눌러주세요.</p></div>`;
  }
  document.getElementById('install-banner-wrap').innerHTML = content;
}

function installPWA() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(r => { deferredPrompt = null; });
}

function switchTab(idx, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pages[idx]).classList.add('active');
  if (idx === 2) recalculate();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function save() { localStorage.setItem('fcc-v2', JSON.stringify(ingredients)); }

function addIngredient() {
  const name = document.getElementById('ing-name').value.trim();
  const unit = document.getElementById('ing-unit').value;
  const qty = parseFloat(document.getElementById('ing-qty').value);
  const price = parseFloat(document.getElementById('ing-price').value);
  if (!name || !qty || !price || qty <= 0 || price <= 0) { showToast('⚠️ 모든 항목을 입력해주세요'); return; }
  ingredients.push({ id: Date.now(), name, unit, qty, price, unitPrice: price/qty });
  save(); renderIngredients(); updateRecipeSelects();
  document.getElementById('ing-name').value = '';
  document.getElementById('ing-qty').value = '';
  document.getElementById('ing-price').value = '';
  showToast('✅ 재료가 추가되었습니다');
}

function removeIngredient(id) {
  ingredients = ingredients.filter(i => i.id !== id);
  save(); renderIngredients(); updateRecipeSelects(); recalculate();
}

function renderIngredients() {
  document.getElementById('ing-count').textContent = `재료 ${ingredients.length}개`;
  const el = document.getElementById('ingredient-list');
  if (!ingredients.length) { el.innerHTML = '<div class="empty"><div class="e-icon">🧅</div><p>재료를 추가해주세요</p></div>'; return; }
  el.innerHTML = ingredients.map(i => `
    <div class="ing-item">
      <div style="flex:1"><div class="ing-name">${i.name}</div><div class="ing-meta">${i.price.toLocaleString()}원 / ${i.qty}${i.unit}</div></div>
      <div style="text-align:right"><div class="ing-unit-price">${i.unitPrice.toFixed(2)}원/${i.unit}</div><button class="btn-danger-sm" onclick="removeIngredient(${i.id})">삭제</button></div>
    </div>`).join('');
}

function addRecipeRow() {
  if (!ingredients.length) { showToast('⚠️ 먼저 재료를 등록해주세요'); return; }
  recipeRows.push({ id: Date.now(), ingId: ingredients[0].id, amount: 0 });
  renderRecipeRows();
}

function removeRecipeRow(id) {
  recipeRows = recipeRows.filter(r => r.id !== id);
  renderRecipeRows(); recalculate();
}

function updateRow(id, field, value) {
  const row = recipeRows.find(r => r.id === id);
  if (row) { row[field] = value; recalculate(); }
}

function renderRecipeRows() {
  const el = document.getElementById('recipe-rows');
  if (!recipeRows.length) { el.innerHTML = '<div class="empty"><div class="e-icon">🍳</div><p>아래 버튼으로 재료를 추가해요</p></div>'; return; }
  el.innerHTML = recipeRows.map(row => {
    const ing = ingredients.find(i => i.id === row.ingId) || ingredients[0];
    const cost = ing ? Math.round(row.amount * ing.unitPrice) : 0;
    return `<div class="recipe-ing-row">
      <select onchange="updateRow(${row.id},'ingId',parseInt(this.value))">${ingredients.map(i=>`<option value="${i.id}"${i.id===row.ingId?' selected':''}>${i.name}</option>`).join('')}</select>
      <div style="display:flex;align-items:center;gap:4px;">
        <input type="number" min="0" step="0.1" value="${row.amount||''}" placeholder="0" inputmode="decimal" oninput="updateRow(${row.id},'amount',parseFloat(this.value)||0)">
        <span style="font-size:11px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;white-space:nowrap">${ing?ing.unit:''}</span>
      </div>
      <button class="remove-btn" onclick="removeRecipeRow(${row.id})">×</button>
      <div class="row-cost">${cost > 0 ? '→ ₩'+cost.toLocaleString() : ''}</div>
    </div>`;
  }).join('');
}

function updateRecipeSelects() { renderRecipeRows(); }

function recalculate() {
  let total = 0;
  recipeRows.forEach(row => {
    const ing = ingredients.find(i => i.id === row.ingId);
    if (ing && row.amount > 0) total += row.amount * ing.unitPrice;
  });
  const servings = parseInt(document.getElementById('recipe-servings').value) || 1;
  const sellPrice = parseFloat(document.getElementById('selling-price').value) || 0;
  const perServing = total / servings;
  document.getElementById('res-total').textContent = '₩' + Math.round(total).toLocaleString();
  document.getElementById('res-per').textContent = '₩' + Math.round(perServing).toLocaleString();
  if (sellPrice > 0 && perServing > 0) {
    const ratio = (perServing / sellPrice) * 100;
    const margin = sellPrice - perServing;
    const re = document.getElementById('res-ratio');
    re.textContent = ratio.toFixed(1) + '%';
    re.className = 'r-value ' + (ratio > 35 ? 'clr-red' : ratio > 25 ? 'clr-accent' : 'clr-green');
    const me = document.getElementById('res-margin');
    me.textContent = '₩' + Math.round(margin).toLocaleString();
    me.className = 'r-value ' + (margin >= 0 ? 'clr-green' : 'clr-red');
  } else {
    document.getElementById('res-ratio').textContent = '-';
    document.getElementById('res-ratio').className = 'r-value';
    document.getElementById('res-margin').textContent = '-';
    document.getElementById('res-margin').className = 'r-value';
  }
  const bEl = document.getElementById('breakdown-list');
  if (!recipeRows.length || total === 0) { bEl.innerHTML = '<div class="empty"><div class="e-icon">📊</div><p>레시피를 구성하면 비중이 표시됩니다</p></div>'; return; }
  bEl.innerHTML = recipeRows.map(row => {
    const ing = ingredients.find(i => i.id === row.ingId);
    if (!ing || !row.amount) return '';
    const cost = row.amount * ing.unitPrice;
    const pct = (cost / total * 100);
    return `<div class="ing-item" style="flex-direction:column;align-items:stretch;gap:6px;">
      <div style="display:flex;justify-content:space-between;"><span style="font-size:13px;font-weight:600;">${ing.name}</span><span style="font-size:12px;color:var(--accent);font-family:'IBM Plex Mono',monospace;">₩${Math.round(cost).toLocaleString()} (${pct.toFixed(1)}%)</span></div>
      <div style="background:var(--border);border-radius:4px;height:6px;overflow:hidden;"><div style="background:var(--accent);width:${pct}%;height:100%;border-radius:4px;transition:width 0.4s ease;"></div></div>
    </div>`;
  }).filter(Boolean).join('');
  calcTarget();
}

function calcTarget() {
  const ratio = parseFloat(document.getElementById('target-ratio').value);
  const servings = parseInt(document.getElementById('recipe-servings').value) || 1;
  let total = 0;
  recipeRows.forEach(row => {
    const ing = ingredients.find(i => i.id === row.ingId);
    if (ing && row.amount > 0) total += row.amount * ing.unitPrice;
  });
  const perServing = total / servings;
  document.getElementById('target-price').textContent = (ratio > 0 && perServing > 0) ? '₩' + Math.round(perServing / (ratio/100)).toLocaleString() : '-';
}

renderIngredients();
renderRecipeRows();
</script>
</body>
</html>
